kind: enhancement
summary: Mask configured auth secrets in request traces.
description: |
  The request tracer now also replaces the values of the secrets in the authentication
  settings of the CEL and HTTP JSON inputs and of the Okta and Jamf entity analytics
  providers, and the values in the CEL secret_state and in the state fields that
  redact.fields names, in headers, URLs, and form and JSON bodies, if they are at least
  eight characters long.
component: filebeat
